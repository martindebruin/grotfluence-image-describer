services:
  image-describer:
    build: .
    container_name: auto-oat
    env_file: identity.env
    environment:
      # non-secret config; real secrets injected at runtime by boot.py from Infisical
      # gemma4:e4b on :8082 is the unified vision+chat model — it serves both steps.
      - VISION_BASE_URL=http://frmwrk-ai:8082/v1
      - VISION_MODEL=gemma4:e4b
      - TEXT_PROVIDER=openai
      - TEXT_BASE_URL=http://frmwrk-ai:8082/v1
      - TEXT_MODEL=gemma4:e4b
      - PYTHONUNBUFFERED=1
      - WEB_USERNAME=martin
      - TELEGRAM_WEBHOOK_URL=https://auto-oat.martindebruin.com/telegram/webhook
      - TELEGRAM_ALLOWED_USER_ID=7105839719
      - DIRECTUS_URL=http://grot-directus:8055
      - BLOG_URL=https://xn--grtfluence-fcb.se
      - MASTODON_INSTANCE=https://mastodon.social
      - MASTODON_ACCESS_TOKEN=
      - BSKY_HANDLE=
      - BSKY_APP_PASSWORD=
      - AIRDROP_URL=http://100.98.25.111:8765
      - AIRDROP_SECRET=
      - AIRDROP_AMOUNT=25
    volumes:
      - ./data:/app/data
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "frmwrk-ai:100.98.25.111"
    networks:
      - default
      - proxy
    restart: unless-stopped

  dashboard:
    image: datasetteproject/datasette
    volumes:
      - ./data:/data
    command: >
      datasette /data/quality.db
      --host 0.0.0.0
      --port 8001
      --setting default_cache_ttl 0
    restart: unless-stopped

networks:
  proxy:
    external: true
