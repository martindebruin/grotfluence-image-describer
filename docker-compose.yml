services:
  image-describer:
    build: .
    ports:
      - "4545:4545"
    environment:
      - VISION_BASE_URL=http://frmwrk-ai:8082/v1
      - VISION_MODEL=qwen2.5vl:3b-gpu
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PYTHONUNBUFFERED=1
      - WEB_USERNAME=${WEB_USERNAME:-martin}
      - WEB_PASSWORD=${WEB_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID}
      - WP_URL=https://grötfluence.se
      - WP_USERNAME=${WP_USERNAME}
      - WP_APP_PASSWORD=${WP_APP_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    image: datasetteproject/datasette
    volumes:
      - ./data:/data
    command: >
      datasette /data/quality.db
      --host 0.0.0.0
      --port 8001
      --setting default_cache_ttl 0
    ports:
      - "4546:8001"
    restart: unless-stopped
