<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grötfluence</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2e3244;
      --accent: #6c8fff;
      --accent-hover: #8aa3ff;
      --text: #e8eaf0;
      --text-muted: #7a7f9a;
      --success: #4ade80;
      --error: #f87171;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      width: 100%;
      max-width: 680px;
    }

    /* Drop zone */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(108, 143, 255, 0.05);
    }

    #drop-zone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }

    .drop-label {
      font-size: 1rem;
      color: var(--text-muted);
    }

    .drop-label span {
      color: var(--accent);
      text-decoration: underline;
    }

    .drop-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }

    /* Preview */
    #preview-wrap {
      display: none;
      margin-top: 1.25rem;
      position: relative;
    }

    #preview-wrap img {
      width: 100%;
      border-radius: 8px;
      display: block;
      max-height: 360px;
      object-fit: contain;
      background: #0a0c12;
    }

    #clear-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 28px;
      text-align: center;
    }

    #clear-btn:hover { background: rgba(248,113,113,0.7); }

    /* Submit */
    #submit-btn {
      display: block;
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.75rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    #submit-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result */
    #result-wrap {
      display: none;
      margin-top: 1.5rem;
    }

    #result-wrap h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    #result-text {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.95rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #error-text {
      color: var(--error);
      font-size: 0.9rem;
      margin-top: 0.75rem;
      display: none;
    }

    /* Copy button */
    #copy-btn {
      margin-top: 0.75rem;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    #copy-btn:hover { color: var(--text); border-color: var(--accent); }

    @media (max-width: 480px) {
      header h1 { font-size: 1.4rem; }
      .card { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Grötfluence ✦</h1>
    <p>Ladda upp din gröt. Få den nedvärderad.</p>
  </header>

  <div class="card">
    <div id="drop-zone">
      <input type="file" id="file-input" accept="image/*" />
      <div class="drop-icon">🖼️</div>
      <div class="drop-label">Släpp din skamliga gröt här eller <span>browse</span></div>
      <div class="drop-sub">JPEG, PNG, WebP, GIF · max 20 MB</div>
    </div>

    <div id="preview-wrap">
      <img id="preview" src="" alt="Preview" />
      <button id="clear-btn" title="Remove image">✕</button>
    </div>

    <p id="error-text"></p>

    <button id="submit-btn" disabled>Recensera gröten</button>

    <div id="result-wrap">
      <h2>Recension</h2>
      <div id="result-text"></div>
      <button id="copy-btn">Copy</button>
    </div>
  </div>

  <script>
    const dropZone  = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const preview   = document.getElementById('preview');
    const previewWrap = document.getElementById('preview-wrap');
    const clearBtn  = document.getElementById('clear-btn');
    const submitBtn = document.getElementById('submit-btn');
    const resultWrap = document.getElementById('result-wrap');
    const resultText = document.getElementById('result-text');
    const errorText  = document.getElementById('error-text');
    const copyBtn   = document.getElementById('copy-btn');

    let selectedFile = null;

    function setFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showError('Please select a valid image file.');
        return;
      }
      selectedFile = file;
      const url = URL.createObjectURL(file);
      preview.src = url;
      previewWrap.style.display = 'block';
      submitBtn.disabled = false;
      resultWrap.style.display = 'none';
      errorText.style.display = 'none';
    }

    function clearFile() {
      selectedFile = null;
      fileInput.value = '';
      preview.src = '';
      previewWrap.style.display = 'none';
      submitBtn.disabled = true;
      resultWrap.style.display = 'none';
      errorText.style.display = 'none';
    }

    function showError(msg) {
      errorText.textContent = msg;
      errorText.style.display = 'block';
    }

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    clearBtn.addEventListener('click', clearFile);

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) setFile(file);
    });

    submitBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Analyserar gröten…';
      resultWrap.style.display = 'none';
      errorText.style.display = 'none';

      try {
        const form = new FormData();
        form.append('file', selectedFile);
        const resp = await fetch('/describe', { method: 'POST', body: form });
        const text = await resp.text();
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${text.slice(0, 200)}`);
        const data = JSON.parse(text);
        resultText.textContent = data.description;
        resultWrap.style.display = 'block';
      } catch (err) {
        showError(err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Recensera gröten';
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(resultText.textContent).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy', 1500);
      });
    });
  </script>
</body>
</html>
